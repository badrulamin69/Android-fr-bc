spring.application.name=EliteUniversity

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/eliteuniversity?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8085

# JWT Configuration
jwt.secret=${JWT_SECRET:EliteUniversitySecretKey2024@BrilliantSofts_SecureJWTSigningKeyMustBe256Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS - Angular Frontend Origin (comma-separated for multiple origins)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App URLs
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.verification.url=${VERIFICATION_URL:http://localhost:8085/api/auth/verify-email}
app.reset-password.url=${RESET_PASSWORD_URL:http://localhost:4200/reset-password}

# DevTools Configuration
# Configures quiet-period and poll-interval to wait for compiler output to settle before restarting
spring.devtools.restart.quiet-period=2000
spring.devtools.restart.poll-interval=3000

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# SSL Commerz
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:multi6a5763c513362}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:multi6a5763c513362@ssl}
sslcommerz.sandbox=${SSLCOMMERZ_SANDBOX:true}
sslcommerz.api-url=${SSLCOMMERZ_API_URL:https://sandbox.sslcommerz.com/gwprocess/v4/api.php}
sslcommerz.validation-url=${SSLCOMMERZ_VALIDATION_URL:https://sandbox.sslcommerz.com/validator/api/validationserverAPI.php}
sslcommerz.success-url=${SSLCOMMERZ_SUCCESS_URL:http://localhost:8085/api/payments/callback}
sslcommerz.fail-url=${SSLCOMMERZ_FAIL_URL:http://localhost:8085/api/payments/callback}
sslcommerz.cancel-url=${SSLCOMMERZ_CANCEL_URL:http://localhost:8085/api/payments/callback}
sslcommerz.ipn-url=${SSLCOMMERZ_IPN_URL:http://localhost:8085/api/payments/ipn}
